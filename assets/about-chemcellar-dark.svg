<svg xmlns="http://www.w3.org/2000/svg" width="800" height="124" viewBox="0 0 800 124" role="img" aria-label="An open-source platform for compound registration, management, and screening. Research groups register molecules, run screening campaigns, and decide what to make next, on infrastructure they control.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <g fill="none" stroke="#9b9bf5" stroke-width="2.2" stroke-linecap="round">
    <path d="M5.4,16.2 Q49.5,18.6 83.4,19.6" pathLength="1" class="draw" style="animation-delay:.3s;animation-duration:.6s"/>
    <path d="M73.3,10.6 Q76.9,13.9 86.2,19.6 M72.2,23.0 Q80.6,21.2 86.1,15.7" class="fade" style="animation-delay:.8s"/>
  </g>
  <text x="112" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8d96a0">An open-source platform for compound registration, management,</text>
  <text x="112" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8d96a0">and screening. Research groups register molecules, run screening</text>
  <text x="112" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8d96a0">campaigns, and decide what to make next, on infrastructure they</text>
  <text x="112" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#8d96a0">control.</text>
</svg>
