<svg xmlns="http://www.w3.org/2000/svg" width="800" height="95" viewBox="0 0 800 95" role="img" aria-label="A chemistry-aware document intelligence platform for drug discovery. Scientists ask questions across a lab's papers and slide decks and get answers cited to the source.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <g fill="none" stroke="#5b5bd6" stroke-width="2.2" stroke-linecap="round">
    <path d="M5.3,20.2 Q55.4,18.9 88.3,17.8" pathLength="1" class="draw" style="animation-delay:.3s;animation-duration:.6s"/>
    <path d="M70.3,9.5 Q77.3,14.7 84.8,16.6 M70.7,23.6 Q77.2,21.6 82.7,19.9" class="fade" style="animation-delay:.8s"/>
  </g>
  <text x="112" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#656d76">A chemistry-aware document intelligence platform for drug</text>
  <text x="112" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#656d76">discovery. Scientists ask questions across a lab&#8217;s papers</text>
  <text x="112" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#656d76">and slide decks and get answers cited to the source.</text>
</svg>
