<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- PARSNIP: targets plotted on three evidence axes; the top-ranked one glows. -->
  <style>
    .s { stroke: #0b0b0d; }
    @media (prefers-color-scheme: dark) { .s { stroke: #fafafa; } }
  </style>
  <defs>
    <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="8" y1="24" x2="25" y2="8">
      <stop offset="0" stop-color="#37d7fa"/>
      <stop offset="0.4" stop-color="#4b72fe"/>
      <stop offset="0.68" stop-color="#ff8df2"/>
      <stop offset="1" stop-color="#ff8705"/>
    </linearGradient>
  </defs>
  <g class="s" fill="none" stroke-width="2" stroke-linecap="round">
    <line x1="10" y1="22" x2="10" y2="4"/>
    <line x1="10" y1="22" x2="28" y2="22"/>
    <line x1="10" y1="22" x2="4" y2="28"/>
  </g>
  <circle cx="14" cy="18" r="1.5" fill="url(#g)"/>
  <circle cx="17.5" cy="15" r="1.8" fill="url(#g)"/>
  <circle cx="21" cy="11.5" r="2.1" fill="url(#g)"/>
  <circle cx="24.5" cy="7.5" r="4.2" fill="#ff8705" opacity=".18"/>
  <circle cx="24.5" cy="7.5" r="2.5" fill="#ff8705"/>
</svg>
