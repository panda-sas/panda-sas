<svg xmlns="http://www.w3.org/2000/svg" width="90" height="28" viewBox="0 0 90 28">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <g fill="none" stroke="#9b9bf5" stroke-width="2" stroke-linecap="round">
    <path d="M5.5,14.5 Q38.5,12.4 81.7,15.7" pathLength="1" class="draw" style="animation-duration:.7s;animation-delay:.3s"/>
    <path d="M70.0,6.4 Q76.3,11.0 80.8,16.2 M68.3,21.9 Q77.6,17.7 79.9,13.4" class="fade" style="animation-delay:.9s"/>
  </g>
</svg>
