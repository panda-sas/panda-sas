<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Hi, I'm Saswati. I'm an AI product builder in drug discovery.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <text x="40" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="600" letter-spacing="-1" fill="#1f2328" class="fade">Hi, I&#8217;m Saswati</text>
  <text x="42" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#656d76" class="fade" style="animation-delay:.3s">I&#8217;m an AI product builder in drug discovery</text>
  <g fill="none" stroke="#656d76" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="1010.0,50.0 966.7,75.0 966.7,125.0 1010.0,150.0 1053.3,125.0 1053.3,75.0" pathLength="1" class="draw"/>
    <circle cx="1010" cy="100" r="27.5" pathLength="1" class="draw" style="animation-delay:.8s"/>
    <line x1="1053.3" y1="75.0" x2="1099.3" y2="49.0" pathLength="1" class="draw" style="animation-delay:1.6s"/>
  </g>
  <circle cx="1099.3" cy="49.0" r="5" fill="#5b5bd6" class="fade breathe" style="animation-delay:2.2s"/>
  <line x1="40" y1="192" x2="1160" y2="192" stroke="#d0d7de"/>
</svg>
