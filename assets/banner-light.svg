<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Saswati Panda. Product manager, AI for drug discovery.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <text x="40" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="600" letter-spacing="-1" fill="#1f2328" class="fade">Saswati Panda</text>
  <text x="42" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#656d76" class="fade" style="animation-delay:.3s">Product manager, AI for drug discovery</text>
  <text x="42" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#656d76" class="fade" style="animation-delay:.6s">from messy lab data to tools scientists actually use</text>
  <g fill="none" stroke="#656d76" stroke-width="1.6" stroke-linejoin="round">
    <polygon points="1010.0,62.0 963.2,89.0 963.2,143.0 1010.0,170.0 1056.8,143.0 1056.8,89.0" pathLength="1" class="draw"/>
    <circle cx="1010" cy="116" r="29.7" pathLength="1" class="draw" style="animation-delay:.8s"/>
    <line x1="1056.8" y1="89.0" x2="1102.8" y2="63.0" pathLength="1" class="draw" style="animation-delay:1.6s"/>
  </g>
  <circle cx="1102.8" cy="63.0" r="5" fill="#5b5bd6" class="fade breathe" style="animation-delay:2.2s"/>
  <line x1="40" y1="232" x2="1160" y2="232" stroke="#d0d7de"/>
</svg>
