<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Saswati Panda. Product, AI, and drug discovery.">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d9cfbd" stroke-opacity=".55"/>
    </pattern>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#0f766e"/><stop offset=".55" stop-color="#6d28d9"/><stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <style>
    .drop { opacity: 0; animation: drop .7s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes drop { from { opacity: 0; transform: translateY(-18px) } to { opacity: 1; transform: none } }
    .fade { opacity: 0; animation: fade 1s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }</style>
  </defs>
  <rect width="1200" height="340" rx="16" fill="#f6f1e7"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>
  <line x1="56" y1="0" x2="56" y2="340" stroke="#be185d" stroke-opacity=".35"/>
  <rect x=".5" y=".5" width="1199" height="339" rx="16" fill="none" stroke="#d9cfbd"/>
  <text x="96" y="64" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#6b6577" class="fade">LAB NOTEBOOK · PAGE 01</text>
  <text x="92" y="168" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="96" fill="#1c1b2e" class="fade" style="animation-delay:.2s">Saswati Panda</text>
  <rect x="98" y="190" width="240" height="4" rx="2" fill="url(#ink)" class="fade" style="animation-delay:.5s"/>
  <text x="96" y="252" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#1c1b2e" class="fade" style="animation-delay:1.1s">Product <tspan fill="#6d28d9">×</tspan> AI <tspan fill="#6d28d9">×</tspan> Drug Discovery</text>
  <text x="96" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#6b6577" class="fade" style="animation-delay:1.4s">observation: messy lab data + the right product = tools scientists actually use<tspan class="caret" fill="#be185d">_</tspan></text>
</svg>
