<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Saswati Panda — Product × AI × Drug Discovery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset=".55" stop-color="#15183a"/>
      <stop offset="1" stop-color="#241447"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="700" y1="0" x2="1150" y2="0">
      <stop offset="0" stop-color="#5eead4"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <style>
      .t  { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .fade { opacity: 0; animation: in .9s ease-out forwards; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .85s }
      @keyframes in { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .node { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n2 { animation-delay: .5s } .n3 { animation-delay: 1s } .n4 { animation-delay: 1.5s } .n5 { animation-delay: 2s } .n6 { animation-delay: 2.5s }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.35); opacity: 1 } }
      .flow { stroke-dasharray: 6 10; animation: dash 2.4s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -64 } }
      .spin { animation: spin 40s linear infinite; transform-origin: 930px 160px; }
      @keyframes spin { to { transform: rotate(360deg) } }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="930" cy="160" r="190" fill="url(#glow)"/>

  <!-- left: identity -->
  <g class="t">
    <text x="64" y="92" class="m fade d1" font-size="15" fill="#5eead4" letter-spacing="2">HELLO, I'M</text>
    <text x="62" y="152" class="fade d2" font-size="56" font-weight="800" fill="#ffffff">Saswati Panda</text>
    <rect x="64" y="172" width="120" height="4" rx="2" fill="url(#accent)" class="fade d2"/>
    <text x="64" y="214" class="fade d3" font-size="24" font-weight="600" fill="#e2e8f0">Product <tspan fill="#a78bfa">×</tspan> AI <tspan fill="#a78bfa">×</tspan> Drug Discovery</text>
    <text x="64" y="254" class="m fade d4" font-size="15" fill="#94a3b8">&gt; turning messy lab data into products scientists actually use<tspan class="caret" fill="#5eead4">▍</tspan></text>
  </g>

  <!-- right: molecule that becomes a roadmap -->
  <g class="spin" opacity=".9">
    <g stroke="url(#accent)" stroke-width="2" fill="none">
      <polygon points="930,90 990,125 990,195 930,230 870,195 870,125"/>
      <polygon points="930,112 971,136 971,184 930,208 889,184 889,136" stroke-opacity=".35"/>
      <line x1="990" y1="125" x2="1050" y2="95"/>
      <line x1="870" y1="195" x2="810" y2="228"/>
    </g>
    <g>
    <circle class="node"    cx="930" cy="90"  r="7" fill="#5eead4"/>
    <circle class="node n2" cx="990" cy="125" r="7" fill="#7dd3fc"/>
    <circle class="node n3" cx="990" cy="195" r="7" fill="#a78bfa"/>
    <circle class="node n4" cx="930" cy="230" r="7" fill="#c084fc"/>
    <circle class="node n5" cx="870" cy="195" r="7" fill="#f472b6"/>
    <circle class="node n6" cx="870" cy="125" r="7" fill="#fb7185"/>
  </g>
  </g>

  <!-- roadmap rail -->
  <g class="m" font-size="12" fill="#cbd5e1">
    <line x1="700" y1="292" x2="1150" y2="292" stroke="url(#rail)" stroke-width="2" class="flow"/>
    <circle cx="730"  cy="292" r="5" fill="#5eead4"/><text x="712"  y="280">discover</text>
    <circle cx="850"  cy="292" r="5" fill="#7dd3fc"/><text x="834"  y="280">define</text>
    <circle cx="970"  cy="292" r="5" fill="#a78bfa"/><text x="958"  y="280">build</text>
    <circle cx="1100" cy="292" r="5" fill="#f472b6"/><text x="1082" y="280">measure</text>
  </g>
</svg>
