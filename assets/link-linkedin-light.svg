<svg xmlns="http://www.w3.org/2000/svg" width="111" height="40" viewBox="0 0 111 40" role="img" aria-label="LinkedIn">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <text x="2" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328">LinkedIn</text>
  <g fill="none" stroke="#5b5bd6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1.3,27.8 Q34.4,29.5 82.6,29.8" pathLength="1" class="draw" style="animation-delay:.4s;animation-duration:.6s"/>
    <path d="M88.2,16.6 Q93.8,13.8 101.7,9.3 M92.9,7.5 L99.9,8.0 L100.4,15.0"/>
  </g>
</svg>
