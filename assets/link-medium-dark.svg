<svg xmlns="http://www.w3.org/2000/svg" width="107" height="40" viewBox="0 0 107 40" role="img" aria-label="Medium">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <text x="2" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e6edf3">Medium</text>
  <g fill="none" stroke="#9b9bf5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-0.4,27.6 Q41.2,27.8 78.0,29.2" pathLength="1" class="draw" style="animation-delay:.4s;animation-duration:.6s"/>
    <path d="M86.2,19.2 Q91.6,11.8 94.0,8.0 M88.3,7.5 L95.3,8.0 L95.8,15.0"/>
  </g>
</svg>
