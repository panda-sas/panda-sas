<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="78" viewBox="0 0 1200 78" role="img" aria-label="DocuStore: Domain-constrained retrieval-augmented generation for drug discovery documents. Preprint, 2026.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <g fill="none" stroke="#5b5bd6" stroke-opacity=".8" stroke-width="2" stroke-linecap="round">
  </g>
  <text x="2" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#1f2328"><tspan font-weight="700">DocuStore:</tspan> Domain-constrained retrieval-augmented generation for drug discovery documents</text>
  <text x="2" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#656d76"><tspan font-style="italic">Preprint</tspan> · 2026</text>
</svg>
