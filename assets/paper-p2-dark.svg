<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-label="CAGE-Fusion: Deep learning for assay nuisance compound detection using a gated co-attention graph embedding model. Journal of Cheminformatics · Springer Nature, 2026.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <g fill="none" stroke="#9b9bf5" stroke-opacity=".8" stroke-width="2" stroke-linecap="round">
  </g>
  <text x="2" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#e6edf3"><tspan font-weight="700">CAGE-Fusion:</tspan> Deep learning for assay nuisance compound detection using a gated co-attention graph</text>
  <text x="2" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#e6edf3">embedding model</text>
  <text x="2" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8d96a0"><tspan font-style="italic">Journal of Cheminformatics</tspan> · Springer Nature · 2026</text>
</svg>
