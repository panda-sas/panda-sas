<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Product pipeline: DocuStore, ChemCellar, PARSNIP and CAGE-Fusion in production; DAIKON scaled to 25+ organizations; DAIKON AI in pilot.">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d9cfbd" stroke-opacity=".55"/>
    </pattern>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0">
      <stop offset="0" stop-color="#0f766e"/><stop offset=".55" stop-color="#6d28d9"/><stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <style>
    .drop { opacity: 0; animation: drop .7s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes drop { from { opacity: 0; transform: translateY(-18px) } to { opacity: 1; transform: none } }
    .fade { opacity: 0; animation: fade 1s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
    .grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1) } }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 2.4s ease-in-out infinite; }
    @keyframes beat { 0%,100% { transform: scale(1); opacity: .9 } 50% { transform: scale(1.6); opacity: .5 } }
    </style>
  </defs>
  <rect width="1200" height="520" rx="16" fill="#f6f1e7"/>
  <rect width="1200" height="520" rx="16" fill="url(#grid)"/>
  <line x1="56" y1="0" x2="56" y2="520" stroke="#be185d" stroke-opacity=".35"/>
