<svg xmlns="http://www.w3.org/2000/svg" width="220" height="56" viewBox="0 0 220 56" role="img" aria-label="In the press">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <text x="10" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-style="italic" fill="#8d96a0">in the press</text>
  <g fill="none" stroke="#9b9bf5" stroke-width="2" stroke-linecap="round">
    <path d="M14,40 C60,50 120,46 178,32" pathLength="1" class="draw" style="animation-duration:.8s;animation-delay:.3s"/>
    <path d="M163.9,30.8 Q171.7,30.8 178.0,30.1 M171.4,43.4 Q175.8,37.9 176.6,29.8" class="fade" style="animation-delay:1s"/>
  </g>
</svg>
