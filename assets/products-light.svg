<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="656" viewBox="0 0 1200 656" role="img" aria-label="Products: DocuStore, ChemCellar, PARSNIP, CAGE-Fusion, DAIKON, DAIKON AI and Curator Studio, each with a short description.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <text x="40" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328" class="fade" style="animation-delay:0.20s">DocuStore</text>
  <g fill="none" stroke="#5b5bd6" stroke-width="2" stroke-linecap="round">
    <path d="M309.3,32.2 Q360.6,30.9 394.3,29.8" pathLength="1" class="draw" style="animation-delay:0.50s;animation-duration:.6s"/>
    <path d="M376.3,21.5 Q383.3,26.7 390.8,28.6 M376.7,35.6 Q383.2,33.6 388.7,31.9" class="fade" style="animation-delay:1.00s"/>
  </g>
  <text x="420" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:0.90s">A chemistry-aware document intelligence platform for drug discovery. Scientists ask</text>
  <text x="420" y="61" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:0.90s">questions across a lab&#8217;s papers and slide decks and get answers cited to the</text>
  <text x="420" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:0.90s">source.</text>
  <line x1="40" y1="121" x2="1160" y2="121" stroke="#d0d7de"/>
  <text x="40" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328" class="fade" style="animation-delay:0.45s">ChemCellar</text>
  <g fill="none" stroke="#5b5bd6" stroke-width="2" stroke-linecap="round">
    <path d="M308.9,144.3 Q354.6,144.8 392.5,144.2" pathLength="1" class="draw" style="animation-delay:0.75s;animation-duration:.6s"/>
    <path d="M377.2,133.1 Q382.7,137.8 387.9,142.7 M377.8,149.3 Q385.6,143.7 390.2,139.4" class="fade" style="animation-delay:1.25s"/>
  </g>
  <text x="420" y="147" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:1.15s">An open-source platform for compound registration, management, and screening.</text>
  <text x="420" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:1.15s">Research groups register molecules, run screening campaigns, and decide what to make</text>
  <text x="420" y="199" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:1.15s">next, on infrastructure they control.</text>
  <line x1="40" y1="233" x2="1160" y2="233" stroke="#d0d7de"/>
  <text x="40" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328" class="fade" style="animation-delay:0.70s">PARSNIP</text>
  <g fill="none" stroke="#5b5bd6" stroke-width="2" stroke-linecap="round">
    <path d="M309.5,255.4 Q342.3,256.7 391.5,251.7" pathLength="1" class="draw" style="animation-delay:1.00s;animation-duration:.6s"/>
    <path d="M380.1,248.7 Q382.9,250.1 389.6,255.7 M380.1,263.2 Q384.4,258.6 389.3,255.8" class="fade" style="animation-delay:1.50s"/>
  </g>
  <text x="420" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:1.40s">A tuberculosis protein assessment and ranking system. It brings together genetic,</text>
  <text x="420" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:1.40s">chemical, and feasibility evidence so teams can rank drug targets consistently.</text>
  <line x1="40" y1="319" x2="1160" y2="319" stroke="#d0d7de"/>
  <text x="40" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328" class="fade" style="animation-delay:0.95s">CAGE-Fusion</text>
  <g fill="none" stroke="#5b5bd6" stroke-width="2" stroke-linecap="round">
    <path d="M307.4,338.4 Q341.9,337.3 388.5,342.5" pathLength="1" class="draw" style="animation-delay:1.25s;animation-duration:.6s"/>
    <path d="M378.3,331.5 Q382.6,336.3 392.1,339.9 M378.9,345.6 Q383.1,344.2 392.9,341.1" class="fade" style="animation-delay:1.75s"/>
  </g>
  <text x="420" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:1.65s">A deep learning model that flags nuisance compounds, the false hits that waste</text>
  <text x="420" y="371" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:1.65s">early-stage assay work. It predicts aggregation, luciferase inhibition, chemical</text>
  <text x="420" y="397" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:1.65s">reactivity, and promiscuity.</text>
  <line x1="40" y1="431" x2="1160" y2="431" stroke="#d0d7de"/>
  <text x="40" y="458" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328" class="fade" style="animation-delay:1.20s">DAIKON</text>
  <g fill="none" stroke="#5b5bd6" stroke-width="2" stroke-linecap="round">
    <path d="M311.3,451.8 Q349.7,453.4 394.8,451.8" pathLength="1" class="draw" style="animation-delay:1.50s;animation-duration:.6s"/>
    <path d="M377.6,443.0 Q384.7,448.2 392.8,453.2 M377.8,461.3 Q385.3,455.6 391.7,452.6" class="fade" style="animation-delay:2.00s"/>
  </g>
  <text x="420" y="457" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:1.90s">An open-source platform for collaborative, target-based drug discovery. The TB Drug</text>
  <text x="420" y="483" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:1.90s">Accelerator, a Gates Foundation initiative with 25+ member organizations, has used</text>
  <text x="420" y="509" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:1.90s">it in production since 2022.</text>
  <line x1="40" y1="543" x2="1160" y2="543" stroke="#d0d7de"/>
  <text x="40" y="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328" class="fade" style="animation-delay:1.45s">DAIKON AI</text>
  <text x="40" y="598" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328" class="fade" style="animation-delay:1.45s">&amp; Curator Studio</text>
  <g fill="none" stroke="#5b5bd6" stroke-width="2" stroke-linecap="round">
    <path d="M309.9,563.9 Q353.6,564.5 393.3,566.2" pathLength="1" class="draw" style="animation-delay:1.75s;animation-duration:.6s"/>
    <path d="M379.2,557.7 Q383.8,560.4 392.0,565.8 M380.0,572.9 Q384.6,567.5 391.7,565.8" class="fade" style="animation-delay:2.25s"/>
  </g>
  <text x="420" y="569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:2.15s">The next generation of DAIKON, in closed user testing. It covers data curation,</text>
  <text x="420" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:2.15s">AI/ML prediction, analysis, and project management across early discovery, from</text>
  <text x="420" y="621" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76" class="fade" style="animation-delay:2.15s">genes and targets through screening, hit assessment, and portfolio.</text>
</svg>
