<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="82" viewBox="0 0 1200 82" role="img" aria-label="Integrating chemical, genetic, and feasibility assessments for anti-tubercular target validation. EMBO Molecular Medicine · Springer Nature, 2025.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
