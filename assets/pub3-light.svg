  <text x="6" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#656d76"><tspan font-style="italic">EMBO Molecular Medicine</tspan> · Springer Nature · 2025</text>
