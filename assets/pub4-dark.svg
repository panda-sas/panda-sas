<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="DAIKON: A data acquisition, integration, and knowledge capture web application for target-based drug discovery. ACS Pharmacology and Translational Science, 2023.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <g fill="none" stroke="#9b9bf5" stroke-opacity=".8" stroke-width="2" stroke-linecap="round">
    <path d="M2.2,37.5 Q593.7,37.6 1068.9,36.5" pathLength="1" class="draw" style="animation-delay:0.80s;animation-duration:.8s"/>
    <path d="M6.2,76.8 Q59.1,76.2 103.9,75.7" pathLength="1" class="draw" style="animation-delay:1.15s;animation-duration:.8s"/>
  </g>
  <text x="6" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#e6edf3"><tspan font-weight="700">DAIKON:</tspan> A data acquisition, integration, and knowledge capture web application for target-based drug</text>
  <text x="6" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="500" fill="#e6edf3">discovery</text>
  <text x="6" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8d96a0"><tspan font-style="italic">ACS Pharmacology &amp; Translational Science</tspan> · 2023</text>
</svg>
