<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="151" viewBox="0 0 1200 151" role="img" aria-label="CAGE-Fusion: A deep learning model that flags nuisance compounds, the false hits that waste early-stage assay work. It predicts aggregation, luciferase inhibition, chemical reactivity, and promiscuity.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328">CAGE-Fusion</text>
  <g fill="none" stroke="#5b5bd6" stroke-width="2" stroke-linecap="round">
    <path d="M286.3,24.5 Q334.4,24.0 371.6,21.7" pathLength="1" class="draw" style="animation-delay:.3s;animation-duration:.6s"/>
    <path d="M360.7,16.0 Q366.2,21.0 372.1,22.2 M359.4,33.7 Q363.9,28.0 371.9,26.3" class="fade" style="animation-delay:.8s"/>
  </g>
  <text x="400" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76">A deep learning model that flags nuisance compounds, the false hits that waste early-</text>
  <text x="400" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76">stage assay work. It predicts aggregation, luciferase inhibition, chemical reactivity,</text>
  <text x="400" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76">and promiscuity.</text>
  <text x="400" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#656d76"><tspan font-style="italic" fill="#1f2328">My role:</tspan> Co-first author. Built the detection framework, which improved detection accuracy by</text>
  <text x="400" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#656d76">4%.</text>
</svg>
