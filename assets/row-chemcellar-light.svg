<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="99" viewBox="0 0 1200 99" role="img" aria-label="ChemCellar: An open-source platform for compound registration, management, and screening. Research groups register molecules, run screening campaigns, and decide what to make next, on infrastructure they control.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328">ChemCellar</text>
  <g fill="none" stroke="#5b5bd6" stroke-width="2" stroke-linecap="round">
    <path d="M289.4,22.2 Q334.6,24.6 369.4,25.6" pathLength="1" class="draw" style="animation-delay:.3s;animation-duration:.6s"/>
    <path d="M359.3,16.6 Q362.9,19.9 372.2,25.6 M358.2,29.0 Q366.6,27.2 372.1,21.7" class="fade" style="animation-delay:.8s"/>
  </g>
  <text x="400" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76">An open-source platform for compound registration, management, and screening. Research</text>
  <text x="400" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76">groups register molecules, run screening campaigns, and decide what to make next, on</text>
  <text x="400" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76">infrastructure they control.</text>
</svg>
