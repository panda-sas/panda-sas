<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="128" viewBox="0 0 1200 128" role="img" aria-label="DAIKON AI &amp; Curator Studio: The next generation of DAIKON, in closed user testing. It covers data curation, AI/ML prediction, analysis, and project management across early discovery, from genes and targets through screening, hit assessment, and portfolio.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328">DAIKON AI</text>
  <text x="0" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2328">&amp; Curator Studio</text>
  <g fill="none" stroke="#5b5bd6" stroke-width="2" stroke-linecap="round">
    <path d="M290.5,22.9 Q339.1,23.6 373.7,23.2" pathLength="1" class="draw" style="animation-delay:.3s;animation-duration:.6s"/>
    <path d="M361.0,17.6 Q365.3,20.1 370.3,22.9 M356.4,32.9 Q364.2,28.3 368.7,25.2" class="fade" style="animation-delay:.8s"/>
  </g>
  <text x="400" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76">The next generation of DAIKON, in closed user testing. It covers data curation, AI/ML</text>
  <text x="400" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76">prediction, analysis, and project management across early discovery, from genes and</text>
  <text x="400" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#656d76">targets through screening, hit assessment, and portfolio.</text>
  <text x="400" y="113" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#656d76"><tspan font-style="italic" fill="#1f2328">My role:</tspan> Product and front-end.</text>
</svg>
