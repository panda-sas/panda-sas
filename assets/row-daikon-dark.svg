<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="99" viewBox="0 0 1200 99" role="img" aria-label="DAIKON: An open-source platform for collaborative, target-based drug discovery. The TB Drug Accelerator, a Gates Foundation initiative with 25+ member organizations, has used it in production since 2022.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3">DAIKON</text>
  <g fill="none" stroke="#9b9bf5" stroke-width="2" stroke-linecap="round">
    <path d="M289.0,22.9 Q333.6,24.7 373.9,22.4" pathLength="1" class="draw" style="animation-delay:.3s;animation-duration:.6s"/>
    <path d="M360.9,16.4 Q365.0,19.7 371.5,23.2 M359.7,33.0 Q363.6,29.2 371.1,21.7" class="fade" style="animation-delay:.8s"/>
  </g>
  <text x="400" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8d96a0">An open-source platform for collaborative, target-based drug discovery. The TB Drug</text>
  <text x="400" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8d96a0">Accelerator, a Gates Foundation initiative with 25+ member organizations, has used it</text>
  <text x="400" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8d96a0">in production since 2022.</text>
</svg>
