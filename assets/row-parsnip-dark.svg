<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="73" viewBox="0 0 1200 73" role="img" aria-label="PARSNIP: A tuberculosis protein assessment and ranking system. It brings together genetic, chemical, and feasibility evidence so teams can rank drug targets consistently.">
  <style>
    .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0 } }
    .fade { opacity: 0; animation: fade 1.2s ease-out forwards; }
    @keyframes fade { to { opacity: 1 } }
    .breathe { animation: breathe 3.6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: 1 } 50% { opacity: .35 } }</style>
  <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#e6edf3">PARSNIP</text>
  <g fill="none" stroke="#9b9bf5" stroke-width="2" stroke-linecap="round">
    <path d="M289.4,24.1 Q324.3,22.6 373.7,22.2" pathLength="1" class="draw" style="animation-delay:.3s;animation-duration:.6s"/>
    <path d="M357.6,16.1 Q363.5,19.9 370.6,22.0 M359.8,31.0 Q364.8,26.8 371.2,23.1" class="fade" style="animation-delay:.8s"/>
  </g>
  <text x="400" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8d96a0">A tuberculosis protein assessment and ranking system. It brings together genetic,</text>
  <text x="400" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8d96a0">chemical, and feasibility evidence so teams can rank drug targets consistently.</text>
</svg>
