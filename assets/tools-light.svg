<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="162" viewBox="0 0 1200 162" role="img" aria-label="Toolkit. Product: User Research, Roadmapping, KPI Design, Agile / Scrum, Figma, Confluence, Tableau; AI / Data: Python, LangChain, Hugging Face, scikit-learn, SQL, KNIME; Build: React, Next.js, Azure, Docker">
